[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdclip"
version = "1.0.0"
description = "A smart cross-platform command clipboard manager for the terminal"
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "M5 Dev", email = "m5dev@proton.me" }]
keywords = ["cli", "terminal", "commands", "clipboard", "snippets", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyperclip>=1.8",
    "groq>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
cmdclip = "cmdclip.cli:main"

[project.urls]
Homepage = "https://github.com/M5-Dev/cmdclip"
Repository = "https://github.com/M5-Dev/cmdclip"
Issues = "https://github.com/M5-Dev/cmdclip/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cmdclip*"]